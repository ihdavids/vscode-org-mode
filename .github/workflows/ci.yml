# Build, lint and test on every push and pull request: the unit tests in node,
# then the editor tests in a downloaded VS Code under a virtual display. The
# suites that need an orgs server or VSCodeVim skip themselves here.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a node ./out/test/runTest.js
